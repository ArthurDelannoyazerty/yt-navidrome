# Preserve native matching thresholds. The bridge explicitly orchestrates plugins;
# auto:false prevents a second implicit import pass and duplicate provider calls.
plugins: [musicbrainz, chroma, fetchart, embedart, lyrics, replaygain]
threaded: false
original_date: true
import:
  write: true
  copy: false
  move: true
  resume: false
  incremental: false
  singletons: true
paths:
  default: $albumartist/$album/$artist - $title
  singleton: $artist/Non-Album/$artist - $title
fetchart:
  auto: false
  sources: [coverart]
embedart:
  auto: false
  remove_art_file: false
lyrics:
  auto: false
  sources: [lrclib]
  synced: true
  print: false
replaygain:
  auto: false
  backend: ffmpeg
  threads: 0
  parallel_on_import: false
  peak: "true"
  # Opus R128 is -23 LUFS (84); Navidrome converts it to -18 LUFS (+5 dB).
  # The bridge forces fresh analysis and retains a peak-only compatibility tag
  # for clipping protection, without a conflicting conventional track-gain tag.
  targetlevel: 89
  r128_targetlevel: 84
