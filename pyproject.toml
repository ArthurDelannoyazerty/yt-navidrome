[project]
name = "music-ingestor"
version = "0.2.0"
description = "Provider-aware, user-separated music ingestion with beets and yt-dlp"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beets[chroma,lyrics,fetchart,embedart]==2.14.1",
    "fastapi>=0.115,<1",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "tenacity>=9,<10", "yt-dlp[default]"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
