<!DOCTYPE html>
<html>
<head>
    <title>Navidrome Ingestor</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #121212; color: #eee; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 200px; background: #2d2d2d; color: white; padding: 10px; }
        select, button { padding: 10px; margin-top: 10px; width: 100%; background: #4CAF50; border: none; color: white; cursor: pointer; }
        #logs { background: #000; color: #0f0; height: 300px; overflow-y: scroll; padding: 10px; font-family: monospace; white-space: pre-wrap;}
    </style>
</head>
<body>
    <h2>🎵 Navidrome Ingestion Pipeline</h2>
    <div class="container">
        <!-- Input Form -->
        <div class="panel">
            <form id="ingestForm">
                <label>Target User / Subfolder:</label>
                <select name="user_id">
                    <option value="1">admin</option>
                    <option value="2">guest</option>
                </select>
                <br><br>
                <label>YouTube / Spotify URLs (One per line):</label>
                <textarea name="urls" placeholder="https://youtu.be/..."></textarea>
                <button type="submit">Validate & Download</button>
            </form>
            <p id="statusMsg"></p>
        </div>

        <!-- Live Log Viewer -->
        <div class="panel">
            <h3>Live Backend Logs</h3>
            <div id="logs">Waiting for tasks...<br></div>
        </div>
    </div>

    <script>
        // Form Submission (No page reload)
        document.getElementById("ingestForm").onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/ingest', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById("statusMsg").innerText = data.message;
            e.target.reset();
        };

        // Live WebSocket Logs
        const ws = new WebSocket(`ws://${window.location.host}/ws/logs`);
        const logBox = document.getElementById("logs");
        ws.onmessage = (event) => {
            logBox.innerHTML += event.data + "<br>";
            logBox.scrollTop = logBox.scrollHeight; // Auto-scroll to bottom
        };
    </script>
</body>
</html>
