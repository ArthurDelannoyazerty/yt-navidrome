<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navidrome Pipeline</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0f111a; color: #e1e4ea; padding: 24px; }
        h2, h3 { margin-top: 0; color: #ffffff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .panel { background: #1a1d27; padding: 20px; border-radius: 10px; border: 1px solid #282c3f; }
        textarea { width: 100%; height: 160px; background: #0f111a; border: 1px solid #3b4261; color: #fff; padding: 12px; border-radius: 6px; resize: vertical; font-family: monospace; }
        select, button { padding: 10px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        select { background: #282c3f; color: white; width: 100%; margin-bottom: 12px; }
        button.btn-primary { background: #4f46e5; color: white; width: 100%; margin-top: 8px; }
        button.btn-primary:hover { background: #4338ca; }
        button.btn-sm { padding: 4px 10px; font-size: 12px; background: #374151; color: white; }
        button.btn-sm:hover { background: #4b5563; }
        #logs { background: #08090d; color: #10b981; height: 230px; overflow-y: scroll; padding: 12px; font-family: monospace; font-size: 13px; border-radius: 6px; white-space: pre-wrap; }
        
        /* Stats Bar */
        .stats-bar { display: flex; gap: 15px; margin-bottom: 15px; }
        .stat-card { flex: 1; background: #282c3f; padding: 12px; border-radius: 6px; text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #282c3f; }
        th { background: #141721; color: #9ca3af; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge-COMPLETED { background: #065f46; color: #34d399; }
        .badge-DOWNLOADING, .badge-PENDING { background: #1e40af; color: #60a5fa; }
        .badge-FAILED, .badge-BOT_BLOCKED { background: #7f1d1d; color: #f87171; }
    </style>
</head>
<body>
    <h2>🎵 Navidrome Music Ingestion Pipeline</h2>
    
    <div class="grid">
        <!-- Ingestion Form -->
        <div class="panel">
            <h3>Add Tracks or Playlists</h3>
            <form id="ingestForm">
                <label>Target User (Subfolder):</label>
                <select name="user_id">
                    <option value="admin">admin</option>
                    <option value="guest">guest</option>
                </select>
                <label>YouTube / Spotify URLs (One per line):</label>
                <textarea name="urls" placeholder="https://www.youtube.com/playlist?list=...&#10;https://open.spotify.com/playlist/..."></textarea>
                <button type="submit" class="btn-primary">Validate & Ingest</button>
            </form>
            <p id="statusMsg" style="color: #60a5fa; margin-top: 10px;"></p>
        </div>

        <!-- Live WebSocket Logs -->
        <div class="panel">
            <h3>Live Ingestion Terminal</h3>
            <div id="logs">Connecting to log stream...<br></div>
        </div>
    </div>

    <!-- Dashboard & Table -->
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Queue & Track Ledger</h3>
            <button class="btn-sm" onclick="retryAllFailed()" style="background: #dc2626;">Retry All Failed</button>
        </div>

        <div class="stats-bar">
            <div class="stat-card">Total<div class="stat-val" id="stat-total">0</div></div>
            <div class="stat-card">Completed<div class="stat-val" id="stat-completed" style="color: #34d399;">0</div></div>
            <div class="stat-card">In Progress<div class="stat-val" id="stat-downloading" style="color: #60a5fa;">0</div></div>
            <div class="stat-card">Failed / Blocked<div class="stat-val" id="stat-failed" style="color: #f87171;">0</div></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Title / URL</th>
                    <th>Playlist</th>
                    <th>Discovery Date</th>
                    <th>Status</th>
                    <th>Error Info</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="track-table-body">
                <tr><td colspan="6">Loading track ledger...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // --- FORM SUBMIT ---
        document.getElementById("ingestForm").onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/ingest', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById("statusMsg").innerText = data.message;
            e.target.reset();
            refreshDashboard();
        };

        // --- WEBSOCKET LOGS ---
        const ws = new WebSocket(`ws://${window.location.host}/ws/logs`);
        const logBox = document.getElementById("logs");
        ws.onmessage = (event) => {
            logBox.innerHTML += event.data + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        };

        // --- DASHBOARD TABLE & RETRIES ---
        async function refreshDashboard() {
            try {
                const res = await fetch('/api/tracks');
                const { tracks, stats } = await res.json();

                document.getElementById('stat-total').innerText = stats.total;
                document.getElementById('stat-completed').innerText = stats.completed;
                document.getElementById('stat-downloading').innerText = stats.downloading;
                document.getElementById('stat-failed').innerText = stats.failed;

                const tbody = document.getElementById('track-table-body');
                if (tracks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No tracks processed yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = tracks.map(t => `
                    <tr>
                        <td><strong>${t.title || 'Unknown'}</strong><br><small style="color: #6b7280;">${t.source_url}</small></td>
                        <td>${t.playlist_name || '—'}</td>
                        <td>${t.discovery_date || '—'}</td>
                        <td><span class="badge badge-${t.status}">${t.status}</span></td>
                        <td style="color: #f87171; font-size: 12px;">${t.error_msg || '—'}</td>
                        <td>
                            ${['FAILED', 'BOT_BLOCKED'].includes(t.status) ? 
                                `<button class="btn-sm" onclick="retryTrack('${t.track_uuid}')">Retry</button>` : ''}
                            ${t.status === 'COMPLETED' ? 
                                `<button class="btn-sm" style="background: #ca8a04;" onclick="forceRetryTrack('${t.track_uuid}')">🔄 Force Retry</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Dashboard refresh error:", err);
            }
        }

        async function retryTrack(uuid) {
            await fetch(`/api/retry/${uuid}`, { method: 'POST' });
            refreshDashboard();
        }

        async function forceRetryTrack(uuid) {
            if (confirm("Are you sure? This will delete the current file and redownload it.")) {
                await fetch(`/api/force-retry/${uuid}`, { method: 'POST' });
                refreshDashboard();
            }
        }

        async function retryAllFailed() {
            await fetch('/api/retry-all-failed', { method: 'POST' });
            refreshDashboard();
        }

        // Auto-refresh the dashboard table every 4 seconds
        setInterval(refreshDashboard, 4000);
        refreshDashboard();
    </script>
</body>
</html>
