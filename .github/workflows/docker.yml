name: Test, Build and Publish
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    # Pin a stable image: ubuntu-latest recently advanced to resolute, which
    # requires a large FFmpeg download and exposes this job to slow mirrors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/static/app.js && node --check src/static/router.js && node --check src/static/ui-state.js && node --check src/static/spotify-ui.js && node --check src/static/metadata-ui.js && node --check src/static/help-ui.js && node --check src/static/catalogue-ui.js && node --check src/static/language-ui.js && node --check src/static/graph-ui.js && node --check src/static/album-ui.js
      - name: Run browser-state regressions
        shell: bash
        run: |
          mkdir -p validation
          node --test tests/router.test.cjs tests/frontend_runtime.test.cjs tests/spotify_frontend.test.cjs tests/metadata_frontend.test.cjs tests/catalogue_frontend.test.cjs tests/help_frontend.test.cjs | tee validation/frontend-tests.txt
      - name: Run real-browser interaction and layout checks
        timeout-minutes: 3
        run: timeout 150s node --test tests/browser_ui.test.cjs
        env:
          REQUIRE_BROWSER: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install prebuilt audio tools (no apt downloads)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/ci-audio-bin"
          mkdir -p "$bin_dir"

          # The pip wheel includes a ready-to-use FFmpeg executable. Avoid
          # apt's full codec dependency tree (89 downloads on ubuntu-24.04).
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --no-deps --retries 2 --timeout 30 "imageio-ffmpeg==0.6.0"
          ffmpeg_binary="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          ln -s "$ffmpeg_binary" "$bin_dir/ffmpeg"

          # Official acoustid/chromaprint fpcalc release (Linux x86_64).
          # Pin the release checksum to prevent unexpected binary changes.
          fpcalc_archive="$RUNNER_TEMP/fpcalc.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 15 --max-time 90 \
            "https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-linux-x86_64.tar.gz" \
            --output "$fpcalc_archive"
          echo "c968ad4a0821592a79b158fb2e1f46cbe0a22a0a1dbc0743c67d68e75d15d2bb  $fpcalc_archive" \
            | sha256sum -c -
          extract_dir="$RUNNER_TEMP/ci-fpcalc-extracted"
          mkdir -p "$extract_dir"
          tar -xzf "$fpcalc_archive" -C "$extract_dir"
          fpcalc_binary="$(find "$extract_dir" -type f -name fpcalc -print -quit)"
          test -n "$fpcalc_binary"
          install -m 755 "$fpcalc_binary" "$bin_dir/fpcalc"

          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="$bin_dir:$PATH"
          ffmpeg -hide_banner -version | head -n 1
          fpcalc -version

          # Fail immediately if the bundled FFmpeg cannot encode the Opus
          # fixtures used in the tests; no need to start the Python suite.
          ffmpeg -hide_banner -loglevel error -f lavfi \
            -i "sine=frequency=440:duration=3" -c:a libopus \
            -y "$RUNNER_TEMP/ci-audio-smoke.opus"
          test -s "$RUNNER_TEMP/ci-audio-smoke.opus"
      - run: python -m pip install uv
      - run: uv sync --frozen --extra test
      - run: uv run python -m compileall -q src tools tests
      - run: uv run pytest --junitxml=validation/pytest.xml
        env:
          REQUIRE_BEETS: '1'
      - name: Archive the exact reviewed source
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/commit.txt
          git archive --format=tar.gz HEAD > validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: validation/
          retention-days: 14
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOWNLOADER_BUILD=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
