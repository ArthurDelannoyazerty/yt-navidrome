name: Test, Build and Publish
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - run: python -m pip install uv
      - run: uv sync --frozen --extra test
      - run: uv run python -m compileall -q src tools tests
      - run: uv run pytest --junitxml=validation/pytest.xml
        env:
          REQUIRE_BEETS: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/static/app.js && node --check src/static/ui-state.js
      - name: Run browser-state regressions
        shell: bash
        run: |
          mkdir -p validation
          node --test tests/frontend_runtime.test.cjs | tee validation/frontend-tests.txt
      - name: Archive the exact reviewed source
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/commit.txt
          git archive --format=tar.gz HEAD > validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: validation/
          retention-days: 14
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOWNLOADER_BUILD=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
