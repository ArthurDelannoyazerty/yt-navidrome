name: Materialize provider-aware update
on:
  push:
    branches: [feature/provider-aware-library]
    paths:
      - '.payload/**'
      - '.github/workflows/materialize-feature.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-aware-library
      - name: Materialize update
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/chunk-* > /tmp/update.b64
          base64 --decode /tmp/update.b64 > /tmp/update.tar.gz
          echo "974b7bdd57a79cd03a7f4a53780b78b8e1bcc020b9601b0375695899ac4504d9  /tmp/update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/update.tar.gz
          rm -rf .payload .github/workflows/materialize-feature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Provider-aware library model and UI redesign"
          git push origin HEAD:feature/provider-aware-library
